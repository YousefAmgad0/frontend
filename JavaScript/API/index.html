<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Recipe Explorer</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand font-weight-bold" href="#">
          <span class="brand-icon">✦</span>
          Recipe<span class="text-danger">Explorer</span>
        </a>

        <span class="navbar-text d-none d-md-block">
          Discover something delicious
        </span>
      </div>
    </nav>

    <!-- Hero -->
    <header class="hero-section text-center">
      <div class="container">
        <span class="section-label">YOUR DAILY INSPIRATION</span>

        <h1 class="hero-title mt-3">
          Discover Your Next<br />
          <span>Favorite Recipe</span>
        </h1>

        <p class="hero-description mx-auto">
          Explore delicious meals from around the world. Find your next favorite
          dish and get inspired to cook.
        </p>

        <!-- Search Form -->

        <input
          type="search"
          id="search-input"
          class="form-control"
          placeholder="Search for a meal... e.g. pizza"
          aria-label="Search for a meal"
        />
      </div>
    </header>

    <!-- Main Content -->
    <main class="container py-5">
      <!-- Recipes Container -->
      <div id="meals-container" class="row">
        <!-- JavaScript will render recipe cards here -->
        <!-- <div class="col-md-3 p-4">
          <div class="inner">
            <h2>title</h2>
            <img src="" alt="">
          </div>
        </div> -->
      </div>
    </main>

    <hr />
    <form class="container p-4 bg-info" id="profile-form">
      <input class="form-control m-2" name="username" value="Yousef" />
      <input class="form-control m-2" name="email" value="yousef@example.com" />
      <input class="form-control m-2" type="file" name="avatar" />
      <button class="form-control m-2" type="submit">Save Profile</button>
    </form>

    <script src="script.js"></script>
  </body>
</html>
